name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # Strip leading 'v' from title so release shows '0.1.4' not 'v0.1.4'
          title="${tag#v}"

          # Pre-release if tag contains a pre-release identifier (-beta, -alpha, -rc, -preview)
          # Stable releases use clean version numbers: 0.1.4, 1.0.0, etc.
          if [[ "$title" =~ -(beta|alpha|rc|preview) ]]; then
            prerelease="--prerelease"
          else
            prerelease=""
          fi

          # Use the matching CHANGELOG section as release notes so GitHub and repository history stay aligned.
          notes_file="release-notes.md"
          awk -v version="$title" '
            BEGIN {
              in_target = 0
            }
            /^## \[/ {
              if (in_target) {
                exit
              }
              heading = $0
              gsub(/^## \[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (heading == version || heading == "v" version) {
                in_target = 1
              }
            }
            in_target {
              print
            }
          ' CHANGELOG.md > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "Release notes for $title were not found in CHANGELOG.md"
            exit 1
          fi

          gh release create "$tag" \
            --title="$title" \
            --notes-file "$notes_file" \
            $prerelease \
            main.js manifest.json styles.css
