name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # Strip leading 'v' from title so release shows '0.1.3' not 'v0.1.3'
          title="${tag#v}"

          # Determine the branch this tag was pushed from.
          # Tags on dev branch = pre-release. Tags on main = stable.
          branch=$(git branch -r --contains "$tag" | grep -v HEAD | sed 's|origin/||' | tr -d ' ' | head -1)

          if [[ "$branch" == "dev" ]]; then
            prerelease="--prerelease"
          else
            prerelease=""
          fi

          gh release create "$tag" \
            --title="$title" \
            $prerelease \
            main.js manifest.json styles.css
