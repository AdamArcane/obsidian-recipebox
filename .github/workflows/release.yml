name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # Strip leading 'v' from title so release shows '0.1.4' not 'v0.1.4'
          title="${tag#v}"

          # Pre-release if tag contains a pre-release identifier (-beta, -alpha, -rc, -preview)
          # Stable releases use clean version numbers: 0.1.4, 1.0.0, etc.
          if [[ "$title" =~ -(beta|alpha|rc|preview) ]]; then
            prerelease="--prerelease"
          else
            prerelease=""
          fi

          gh release create "$tag" \
            --title="$title" \
            $prerelease \
            main.js manifest.json styles.css
