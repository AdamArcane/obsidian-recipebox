name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # Strip leading 'v' from title so release shows '0.1.2' not 'v0.1.2'
          title="${tag#v}"

          # Treat anything below 1.0.0 as a pre-release (early beta builds).
          # Once the plugin is in the community directory, tags will start at
          # 1.0.0 and this condition will no longer match.
          if [[ "$title" =~ ^0\. ]]; then
            prerelease="--prerelease"
          else
            prerelease=""
          fi

          gh release create "$tag" \
            --title="$title" \
            $prerelease \
            main.js manifest.json styles.css
