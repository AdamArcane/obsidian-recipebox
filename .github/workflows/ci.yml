name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci

      # Runs typecheck + esbuild + eslint (same as a local `npm run build`).
      # Catches lint/type errors before merge, same checks the release
      # workflow relies on when it later builds from a tag.
      - name: Build (typecheck + lint)
        run: npm run build

      - name: Unit tests
        run: npm run test

      # Separate tsconfig for tests (tests/tsconfig.json), so this is not
      # redundant with the src typecheck above.
      - name: Typecheck tests
        run: npm run test:typecheck
